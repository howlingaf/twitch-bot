<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Now Playing</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: transparent;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow: hidden;
  }

  #nowplaying {
    position: fixed;
    top: 0;
    left: 0;
    display: flex;
    align-items: center;
    gap: 12px;
    background: #1e1e1e;
    border-radius: 0;
    padding: 8px 16px;
    max-width: 340px;
    width: 340px;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }

  /* "none" rather than translateY(0): any leftover transform keeps the card
     on its own compositing layer, which renders text and art soft. */
  #nowplaying.visible {
    opacity: 1;
    transform: none;
  }

  #album-art {
    width: 64px;
    height: 64px;
    border-radius: 4px;
    object-fit: cover;
    flex-shrink: 0;
  }

  #track-info {
    flex: 1;
    min-width: 0;
    color: #fff;
  }

  #song-name {
    font-size: 16px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #artist-name {
    font-size: 13px;
    color: #b3b3b3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 2px;
  }

  #progress-bar {
    margin-top: 4px;
    width: 100%;
    height: 3px;
    background: rgba(255, 255, 255, 0.15);
    border-radius: 2px;
    overflow: hidden;
  }

  #progress-fill {
    height: 100%;
    background: #1db954;
    border-radius: 2px;
    width: 0%;
    transition: width 0.15s linear;
  }
</style>
</head>
<body>

<div id="nowplaying">
  <img id="album-art" src="" alt="">
  <div id="track-info">
    <div id="song-name"></div>
    <div id="artist-name"></div>
    <div id="progress-bar">
      <div id="progress-fill"></div>
    </div>
  </div>
</div>

<script>
  // ?scale=2 renders everything at 2x so it stays sharp when the OBS source
  // is sized up (set the browser source to 680 wide, don't stretch it).
  const scale = parseFloat(new URLSearchParams(location.search).get('scale'));
  if (scale > 0) document.body.style.zoom = scale;

  const container = document.getElementById('nowplaying');
  const albumArt = document.getElementById('album-art');
  const songName = document.getElementById('song-name');
  const artistName = document.getElementById('artist-name');
  const progressFill = document.getElementById('progress-fill');

  let progressMs = 0;
  let durationMs = 0;
  let isPlaying = false;
  let lastUpdateTime = 0;
  let tickInterval = null;

  function updateProgress() {
    if (!isPlaying || durationMs <= 0) return;
    const elapsed = Date.now() - lastUpdateTime;
    const current = Math.min(progressMs + elapsed, durationMs);
    const pct = (current / durationMs) * 100;
    progressFill.style.width = pct + '%';
  }

  function startTick() {
    if (tickInterval) return;
    tickInterval = setInterval(updateProgress, 100);
  }

  function stopTick() {
    if (tickInterval) {
      clearInterval(tickInterval);
      tickInterval = null;
    }
  }

  function handleNowPlaying(data) {
    if (!data.is_playing) {
      if (isPlaying) {
        isPlaying = false;
        stopTick();
        container.classList.remove('visible');
      }
      return;
    }

    songName.textContent = data.song;
    artistName.textContent = data.artists;

    if (albumArt.src !== data.album_art) {
      albumArt.src = data.album_art;
    }

    progressMs = data.progress_ms;
    durationMs = data.duration_ms;
    lastUpdateTime = Date.now();

    const pct = durationMs > 0 ? (progressMs / durationMs) * 100 : 0;
    progressFill.style.width = pct + '%';

    if (!isPlaying) {
      isPlaying = true;
      container.classList.add('visible');
      startTick();
    }
  }

  function connect() {
    // Served by the bot itself (https://twitch.howling.one/nowplaying), so
    // connect back to wherever the page came from; a copy opened as a local
    // file has no host and uses the public address.
    const url = location.host
      ? `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}`
      : 'wss://twitch.howling.one';
    const ws = new WebSocket(url);

    ws.onopen = () => console.log('WebSocket connected');

    ws.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        if (data.command === 'nowplaying') {
          handleNowPlaying(data);
        }
      } catch (e) {
        console.error('Parse error:', e);
      }
    };

    ws.onclose = () => {
      console.log('WebSocket disconnected, reconnecting in 3s...');
      stopTick();
      setTimeout(connect, 3000);
    };

    ws.onerror = (err) => {
      console.error('WebSocket error:', err);
      ws.close();
    };
  }

  // ?demo=1 shows a sample track without the bot (it only reads Spotify while
  // live), to check the look in OBS's preview offline.
  if (new URLSearchParams(location.search).get('demo')) {
    const art = 'data:image/svg+xml,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640">' +
      '<rect width="640" height="640" fill="#1db954"/>' +
      '<circle cx="320" cy="320" r="200" fill="#191414"/>' +
      '<circle cx="320" cy="320" r="40" fill="#fff"/></svg>');
    const start = Date.now();
    const demo = () => handleNowPlaying({
      is_playing: true, song: 'Preview Track Name That Runs Long', artists: 'Sample Artist, Another Artist',
      album_art: art, progress_ms: (Date.now() - start) % 180000, duration_ms: 180000 });
    demo();
    setInterval(demo, 5000);
  } else {
    connect();
  }
</script>
</body>
</html>
